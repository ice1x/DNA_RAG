name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4

      - name: Build and push clean deploy to HF
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          # Create a temp directory with only the files HF needs
          DEPLOY_DIR=$(mktemp -d)

          # Copy source code
          cp -r src/ "$DEPLOY_DIR/src/"
          cp -r .streamlit/ "$DEPLOY_DIR/.streamlit/"
          cp Dockerfile.hf "$DEPLOY_DIR/Dockerfile"
          cp pyproject.toml "$DEPLOY_DIR/"
          cp requirements.txt "$DEPLOY_DIR/"
          cp LICENSE "$DEPLOY_DIR/"

          # Create HF Space README with frontmatter
          cat > "$DEPLOY_DIR/README.md" << 'EOF'
          ---
          title: DNA RAG
          emoji: 🧬
          colorFrom: blue
          colorTo: purple
          sdk: docker
          app_port: 8501
          license: mit
          pinned: false
          ---

          # DNA RAG

          Analyse your personal DNA data using Large Language Models.

          Upload your raw DNA file (23andMe, AncestryDNA, MyHeritage, VCF) and ask questions in plain English.

          **Bring your own API key** from DeepSeek or any OpenAI-compatible provider.

          Your DNA data is never stored — everything runs in your session only.

          [GitHub](https://github.com/ice1x/DNA_RAG) | [PyPI](https://pypi.org/project/dna-rag/)
          EOF

          # Init fresh git repo (no history = no binary file refs)
          cd "$DEPLOY_DIR"
          git init -b main
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "deploy from github.com/ice1x/DNA_RAG"
          git remote add hf https://ice1x:${HF_TOKEN}@huggingface.co/spaces/ice1x/DNA_RAG
          git push hf main --force
