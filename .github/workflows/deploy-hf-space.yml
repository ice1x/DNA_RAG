name: Deploy to Hugging Face Space

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout GitHub repo
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install Git LFS
        run: git lfs install

      - name: Prepare for HF Space
        run: |
          # Replace Dockerfile with HF-specific one
          cp Dockerfile.hf Dockerfile

          # Track binary files with Git LFS (required by HF)
          git lfs track "*.png" "*.jpg" "*.jpeg" "*.gif" "*.webp"

          # Replace README with HF Space metadata
          cat > README.md << 'EOF'
          ---
          title: DNA RAG
          emoji: 🧬
          colorFrom: blue
          colorTo: purple
          sdk: docker
          app_port: 8501
          pinned: false
          ---

          # DNA RAG

          Analyse your personal DNA data using Large Language Models.

          Upload your raw DNA file (23andMe, AncestryDNA, MyHeritage, VCF) and ask questions in plain English.

          **Bring your own API key** from DeepSeek or any OpenAI-compatible provider.

          Your DNA data is never stored — everything runs in your session only.

          [GitHub](https://github.com/ice1x/DNA_RAG) | [PyPI](https://pypi.org/project/dna-rag/)
          EOF

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "ci: prepare for HF Space deploy"

      - name: Push to Hugging Face Space
        env:
          HF_TOKEN: ${{ secrets.HF_TOKEN }}
        run: |
          git remote add hf https://ice1x:${HF_TOKEN}@huggingface.co/spaces/ice1x/DNA_RAG || true
          git push hf main --force
