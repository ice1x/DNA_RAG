[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "dna-rag"
dynamic = ["version"]
description = "DNA analysis RAG pipeline powered by LLMs"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = [
    "pandas>=2.1,<3",
    "pydantic>=2.5,<3",
    "pydantic-settings>=2.1,<3",
    "httpx>=0.25,<1",
    "structlog>=24.1",
    "click>=8.1,<9",
    "tenacity>=8.2,<10",
]

[project.optional-dependencies]
api = [
    "fastapi>=0.110,<1",
    "uvicorn[standard]>=0.27,<1",
    "python-multipart>=0.0.6",
]
rag = [
    "chromadb>=0.4.22",
    "sentence-transformers>=2.3.1",
]
ui = [
    "streamlit>=1.31,<2",
]
dev = [
    "pytest>=8.0",
    "pytest-cov>=5.0",
    "pytest-httpx>=0.30",
    "pytest-asyncio>=0.23",
    "mypy>=1.8",
    "ruff>=0.3",
    "coverage[toml]>=7.4",
    "pandas-stubs>=2.1",
]

[project.scripts]
dna-rag = "dna_rag.cli:main"
dna-rag-api = "dna_rag.api.main:run"
dna-rag-ui = "dna_rag.ui.app:run"

[tool.hatch.version]
path = "src/dna_rag/_version.py"

[tool.hatch.build.targets.wheel]
packages = ["src/dna_rag"]

# ---------------------------------------------------------------------------
# pytest
# ---------------------------------------------------------------------------
[tool.pytest.ini_options]
addopts = "--cov=dna_rag --cov-report=term-missing --cov-fail-under=80 -v"
testpaths = ["tests"]
asyncio_mode = "auto"

# ---------------------------------------------------------------------------
# coverage
# ---------------------------------------------------------------------------
[tool.coverage.run]
branch = true
source = ["dna_rag"]
omit = [
    "src/dna_rag/parsers/base.py",
    "src/dna_rag/cache/base.py",
    "src/dna_rag/llm/base.py",
    "src/dna_rag/vector_store.py",
]

[tool.coverage.report]
show_missing = true
fail_under = 80
exclude_lines = [
    "pragma: no cover",
    "if TYPE_CHECKING:",
    "if __name__",
    "\\.\\.\\.",
    "@(abc\\.)?abstractmethod",
    "class.*\\bProtocol\\b",
]

# ---------------------------------------------------------------------------
# mypy
# ---------------------------------------------------------------------------
[tool.mypy]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

# ---------------------------------------------------------------------------
# ruff
# ---------------------------------------------------------------------------
[tool.ruff]
target-version = "py311"
line-length = 99

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "SIM"]
