# ---------------------------------------------------------------------------
# DNA RAG — Docker Compose (development)
# ---------------------------------------------------------------------------
#
# Usage:
#   docker compose up          — start API server
#   docker compose up --build  — rebuild and start
#   docker compose down        — stop and remove
#
services:
  api:
    build:
      context: .
      target: api
    ports:
      - "8000:8000"
    env_file: .env
    environment:
      DNA_RAG_LOG_FORMAT: json
      DNA_RAG_LOG_LEVEL: INFO
      DNA_RAG_API_HOST: "0.0.0.0"
      DNA_RAG_API_PORT: "8000"
    volumes:
      # Mount uploads directory for persistence across restarts
      - dna-uploads:/tmp/dna_rag_uploads
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 5s
      retries: 3

volumes:
  dna-uploads:
